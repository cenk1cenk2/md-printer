---
stages:
  - install
  - build
  - publish

variables:
  NODE_VERSION: 26-alpine

include:
  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml

  - project: devops/pipelines
    ref: node@2.2.0
    file:
      - /node/install.gitlab-ci.yml
      - /node/build.gitlab-ci.yml
      - /node/lint.gitlab-ci.yml
      - /node/run.gitlab-ci.yml

  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml

install:
  stage: install
  extends:
    - .node-install

lint:
  stage: build
  extends:
    - .node-lint

typecheck:
  stage: build
  extends: .node-run
  variables:
    NODE_COMMAND_SCRIPT: typecheck

build:
  stage: build
  extends:
    - .node-build
  artifacts:
    paths:
      - dist/
      - oclif.manifest.json

test:
  stage: build
  extends:
    - .node-lint
  needs:
    - install
    - build
  variables:
    NODE_LINT_COMMAND: test
    CHROME_PATH: /usr/bin/chromium-browser
  cache:
    - key: $CI_JOB_NAME_SLUG-apk
      paths:
        - .apk-cache/
  before_script:
    - mkdir -p .apk-cache
    # apk resolves a relative cache directory against the filesystem root, and an empty cache holds no package index
    - apk add --cache-dir "$CI_PROJECT_DIR/.apk-cache" --update-cache chromium font-noto

semantic-release:
  stage: publish
  extends:
    - .semantic-release
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(master|main|alpha|beta|rc|next)$/'
      interruptible: true
    - when: never
